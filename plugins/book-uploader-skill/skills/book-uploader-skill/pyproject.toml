[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "book-uploader-skill"
version = "0.1.12"
description = "ProofBound book uploader skill — validate a Quarto folder, auto-fix missing config, scan for secrets, then upload via the admin script"
authors = [{name = "Proofbound", email = "team@proofbound.com"}]
license = {text = "LicenseRef-ProofBound-Source-Available"}
readme = "SKILL.md"
requires-python = ">=3.10"

dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pypdf>=6.21",
    "fonttools",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.proofbound.skill]
# Read by scripts/package-skill.sh. `target` picks the closing instructions and
# gates the shipped-artifact path lint; `runtime` injects the canonical auth
# client; `vendor` names extra source trees to inject from HEAD.
# (Kept free of monorepo paths on purpose -- this file ships.)
target = "claude-ai"
runtime = true
vendor = ["proofbound-portable"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""
